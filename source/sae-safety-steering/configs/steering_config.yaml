model:
  name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  local_path: "models/llama"
  device: "cuda"
  dtype: "bfloat16"

sae:
  name: "Llama-3.1-8B-Instruct-SAE-l19"
  hf_repo: "Goodfire/Llama-3.1-8B-Instruct-SAE-l19"
  local_path: "models/sae/Llama-3.1-8B-Instruct-SAE-l19.pth"
  hook_layer: "model.layers.19"
  expansion_factor: 16

data:
  train_path: "data/adversarial/train.jsonl"
  test_path: "data/adversarial/eval.jsonl"
  jbb_test_path: "data/jailbreakbench/test.jsonl"
  max_train_samples: 1500
  max_test_samples: 400

steering:
  harmful_activation_threshold: 1.0
  ablate_harmful: true
  boost_unharmful: true
  unharmful_boost_strength: 4.0

eval:
  results_dir: "results"
  judge_model: "gpt-4o-mini"
  guardreasoner_model: "yueliu1999/GuardReasoner-1B"
  max_new_tokens: 128
